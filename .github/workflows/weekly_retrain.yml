name: Weekly Model Retraining Pipeline

on:
  schedule:
    - cron: '30 5 * * 0' # Runs every Sunday at 00:30 CDT (05:30 UTC)
  workflow_dispatch:

jobs:
  retrain-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python
        working-directory: ./backend
        run: uv python install

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync

      - name: Run unit tests
        working-directory: ./backend
        run: uv run pytest

      - name: Execute retraining script
        working-directory: ./backend
        run: uv run python -m src.train

      - name: Commit and push updated model artifact
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/models/
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore(mlops): automated model retraining [skip ci]" && \
            git pull --rebase --autostash origin ${{ github.ref_name }} && \
            git push origin ${{ github.ref_name }}
          )