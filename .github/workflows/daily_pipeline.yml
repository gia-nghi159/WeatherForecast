name: Daily Pipeline & Ground Truth Evaluation

on:
  schedule:
    - cron: '0 5 * * *'  # Runs every day at 00:00 CDT (05:00 UTC)
  workflow_dispatch:

jobs:
  daily-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python
        working-directory: ./backend
        run: uv python install

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync

      - name: Run unit tests
        working-directory: ./backend
        run: uv run pytest

      - name: Execute Daily Ingestion & Ground-Truth Evaluation
        working-directory: ./backend
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: uv run python -m src.pipeline daily

      - name: Warm Up Production Cache
        working-directory: ./backend
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          uv run uvicorn src.main:app --host 127.0.0.1 --port 8000 &
          sleep 5
          uv run python -m src.warm_cache

      - name: Commit and push updated datasets & evaluation logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore(mlops): automated daily data & evaluation update [skip ci]" && \
            git pull --rebase origin main && \
            git push
          )