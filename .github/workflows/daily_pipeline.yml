name: Daily Pipeline & Ground Truth Evaluation

on:
  schedule:
    - cron: '0 5 * * *'  # Runs every day at 00:00 CDT (05:00 UTC)
  workflow_dispatch:

jobs:
  daily-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Spawns a lightweight Redis service container inside GitHub Actions (no secrets needed!)
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python
        working-directory: ./backend
        run: uv python install

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync

      - name: Run unit tests
        working-directory: ./backend
        env:
          REDIS_URL: redis://localhost:6379
        run: uv run pytest

      - name: Execute Daily Ingestion & Ground-Truth Evaluation
        working-directory: ./backend
        env:
          REDIS_URL: redis://localhost:6379
        run: uv run python -m src.pipeline daily

      - name: Commit and push updated datasets & evaluation logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore(mlops): automated daily data & evaluation update [skip ci]" && \
            git pull --rebase --autostash origin ${{ github.ref_name }} && \
            git push origin ${{ github.ref_name }}
          )